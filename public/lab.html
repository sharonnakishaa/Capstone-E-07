<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8" />
<title>EPEN — Ringkasan Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&family=Playfair+Display+SC:wght@700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/epen.css">
<style>
  .updated{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}

  main{max-width:1280px;margin:0 auto;padding:36px 24px 56px;display:flex;flex-direction:column;gap:28px}

  /* HERO RINGKASAN */
  .summary{display:flex;align-items:flex-end;gap:20px 32px;flex-wrap:wrap}
  .sum-text{display:flex;flex-direction:column;gap:16px;min-width:0}
  .sum-title{font-family:var(--display);font-size:44px;font-weight:900;color:var(--text-strong);letter-spacing:.01em;line-height:1.02;margin:0}
  .sum-pills{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
  .sum-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--sh-sm);font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--text-strong)}
  .sum-pill b{font-family:var(--mono);font-size:16px}
  .sum-pill i{width:10px;height:10px;border-radius:3px;display:inline-block;border:1.5px solid var(--line)}
  .sum-pill.zero{opacity:.5;box-shadow:none}

  .error{display:none;padding:12px 16px;border-radius:10px;background:var(--err-bg);border:2px solid var(--err-border);color:var(--err-text);font-size:14px;font-weight:600}
  .error.show{display:block}

  /* GRUP & GRID */
  .group-title{margin-bottom:14px}
  .group-title small{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--muted);margin-left:8px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}

  /* KARTU DEVICE — garis kiri tebal mengikuti warna status */
  .dev-card{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:2px solid var(--line);border-left-width:10px;border-radius:12px;padding:18px 18px 16px;box-shadow:var(--sh);color:inherit;text-decoration:none;transition:transform .12s ease,box-shadow .12s ease;min-width:0}
  .dev-card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow-c)}
  .dev-card:active{transform:translate(2px,2px);box-shadow:var(--sh-sm)}
  .dc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .dc-name{font-size:17px;font-weight:800;color:var(--text-strong);letter-spacing:-.005em;overflow-wrap:anywhere}
  .dc-loc{font-size:12.5px;color:var(--muted)}
  .dc-value{display:flex;align-items:baseline;gap:6px}
  .dc-value .num{font-family:var(--mono);font-size:38px;font-weight:700;color:var(--text-strong);letter-spacing:-.03em;line-height:1}
  .dc-value .unit{font-size:13px;color:var(--muted);font-weight:700}
  .dc-raw{font-family:var(--mono);font-size:12px;color:var(--muted-2);margin-top:-6px}
  .dc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 0;border-top:1.5px dashed var(--border-soft);border-bottom:1.5px dashed var(--border-soft)}
  .dc-stats .k{display:block;font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
  .dc-stats .v{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text-strong);white-space:nowrap}
  .dc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .chip-warn{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:800;background:var(--tint-waspada);color:var(--ink-waspada);border:1.5px solid currentColor}
  .dev-card.offline .dc-value,.dev-card.offline .dc-raw,.dev-card.offline .dc-stats{opacity:.5}
  .badge{flex-shrink:0}

  .empty{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted)}

  @media (max-width:720px){
    .updated{font-size:11px}
    main{padding:24px 16px 40px;gap:20px}
    .sum-title{font-size:32px}
    .sum-pills{margin-left:0}
    .grid{grid-template-columns:1fr}
  }
  @media (max-width:420px){
    /* Topbar sempit: jam pembaruan disembunyikan (tiap kartu sudah menampilkan umur datanya) */
    .updated{display:none}
    #authWidget{margin-left:auto}
  }
</style>
<script src="/auth.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/lab.html" aria-label="EPEN — Ringkasan Lab">
    <span class="brand-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(45 12 12)"><rect x="9.5" y="0.5" width="5" height="9" rx="2"/><path d="M12 9.5v5.5"/><path d="M10.6 15h2.8L12 20.5z"/></g><path d="M2.5 21.5h6"/><path d="M3.5 12.5c-1.2-1.4 1.2-2.6 0-4M7 9c-1.2-1.4 1.2-2.6 0-4"/></svg></span>
    <span class="brand-text"><span class="brand-title">EPEN</span><span class="brand-sub">Ringkasan Lab</span></span>
  </a>
  <span class="updated"><span class="updated-label">Diperbarui </span><span id="updated">—</span></span>
  <div id="authWidget"></div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle tema"></button>
</header>

<main>
  <section class="summary" aria-live="polite">
    <div class="sum-text">
      <span class="tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Kondisi Seluruh Alat</span>
      <h1 class="sum-title" id="sumTitle">Memuat data...</h1>
    </div>
    <div class="sum-pills" id="sumPills"></div>
  </section>

  <div class="error" id="errorBox" role="alert"></div>

  <div id="groups"></div>
</main>

<script>
/* THEME */
(function(){
  const root=document.documentElement,btn=document.getElementById('themeToggle');
  const MOON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z"/></svg>`;
  const SUN=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
  function apply(t){
    root.dataset.theme=t;btn.innerHTML=t==='light'?MOON:SUN;
    try{localStorage.setItem('epen-theme',t)}catch(e){}
    if(window.CFG&&window._last) render(window._last);
  }
  btn.addEventListener('click',()=>apply(root.dataset.theme==='light'?'dark':'light'));
  const saved=(()=>{try{return localStorage.getItem('epen-theme')}catch(e){return null}})();
  apply(saved==='dark'?'dark':'light');
})();

/* HELPERS */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const isLight=()=>document.documentElement.dataset.theme==='light';
function fmtNum(v,d=0){return v==null?'—':Number(v).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour12:false});}
function fmtAge(ms){
  const s=Math.max(0,Math.round(ms/1000));
  if(s<60) return `${s} detik lalu`;
  if(s<3600) return `${Math.floor(s/60)} menit lalu`;
  if(s<86400) return `${Math.floor(s/3600)} jam lalu`;
  return `${Math.floor(s/86400)} hari lalu`;
}
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const OFFLINE_COLOR=()=>cssVar('--muted-2');
const statusColor=k=>k==='OFFLINE'?OFFLINE_COLOR():(isLight()?CFG.statuses[k].text_light:CFG.statuses[k].color);
const WARN_ICON='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
const BADGE={AMAN:'aman',WASPADA:'waspada',BERBAHAYA:'bahaya',OFFLINE:'off'};
// Urutan tampil: yang paling perlu ditangani di atas. OFFLINE di atas AMAN karena alat tidak terpantau.
const SEVERITY={BERBAHAYA:3,WASPADA:2,OFFLINE:1,AMAN:0};

/* CONFIG */
window.CFG=null;
async function loadConfig(){
  for(;;){
    try{
      const res=await fetch('/api/config');
      if(!res.ok) throw new Error('HTTP '+res.status);
      window.CFG=await res.json();
      return;
    }catch(e){
      showError('Gagal memuat konfigurasi. Mencoba lagi...');
      await sleep(5000);
    }
  }
}
function showError(msg){const el=$('errorBox');el.textContent=msg;el.classList.toggle('show',!!msg);}

/* RENDER */
function deviceState(d,serverTime){
  const l=d.latest;
  if(!l) return {status:'OFFLINE',ageMs:null};
  const ageMs=new Date(serverTime)-new Date(l.recorded_at);
  const status=ageMs>CFG.offline_after_ms?'OFFLINE':(l.air_status in CFG.statuses?l.air_status:'AMAN');
  return {status,ageMs};
}

function cardHtml(d,st){
  const l=d.latest, off=st.status==='OFFLINE';
  const tvoc=l?(l.tvoc_kalman_ppb??l.tvoc_raw_ppb):null;
  const dustWarn=d.dust_samples>0&&d.dust_outlet_avg_ugm3>CFG.outlet_dust.warn_ugm3;
  const foot=!l
    ?'Belum ada data dari perangkat'
    :off?`Data terakhir ${fmtAge(st.ageMs)}`:`Diperbarui ${fmtAge(st.ageMs)}`;
  return `
    <a class="dev-card${off?' offline':''}" href="/index.html?device=${encodeURIComponent(d.id)}" style="border-left-color:${statusColor(st.status)}"
       aria-label="${esc(d.device_name)}: ${st.status}">
      <div class="dc-head">
        <div>
          <div class="dc-name">${esc(d.device_name)}</div>
          <div class="dc-loc">${esc(d.location)}</div>
        </div>
        <span class="badge ${BADGE[st.status]}"><span class="dot-s"></span>${st.status}</span>
      </div>
      <div class="dc-value"><span class="num">${tvoc==null?'—':fmtNum(Math.round(tvoc))}</span><span class="unit">ppb TVOC</span></div>
      <div class="dc-raw">${!l?'&nbsp;':l.tvoc_kalman_ppb!=null?`Mentah ${fmtNum(l.tvoc_raw_ppb)} ppb`:'Pemanasan sensor'}</div>
      <div class="dc-stats">
        <div><span class="k">Kipas</span><span class="v">${l?`${fmtNum(l.fan_duty_percent)}%`:'—'}</span></div>
        <div><span class="k">RPM</span><span class="v">${l?fmtNum(l.fan_rpm):'—'}</span></div>
        <div><span class="k">Debu</span><span class="v">${l?fmtNum(l.dust_outlet_ugm3,1):'—'}</span></div>
      </div>
      <div class="dc-foot">
        <span>${foot}</span>
        ${dustWarn?`<span class="chip-warn" title="Rata-rata debu outlet ${fmtNum(d.dust_outlet_avg_ugm3,1)} µg/m³ melebihi batas ${fmtNum(CFG.outlet_dust.warn_ugm3)} µg/m³">${WARN_ICON}Periksa filter</span>`:''}
      </div>
    </a>`;
}

function render({data,server_time}){
  window._last={data,server_time};
  const items=data.map(d=>({d,st:deviceState(d,server_time)}));
  const counts={BERBAHAYA:0,WASPADA:0,AMAN:0,OFFLINE:0};
  items.forEach(it=>counts[it.st.status]++);

  // Ringkasan atas
  const n=items.length;
  let title;
  if(!n) title='Belum ada perangkat terdaftar';
  else if(counts.BERBAHAYA) title=`${counts.BERBAHAYA} dari ${n} alat BERBAHAYA`;
  else if(counts.WASPADA) title=`${counts.WASPADA} dari ${n} alat WASPADA`;
  else if(counts.OFFLINE===n) title=`Semua alat (${n}) OFFLINE`;
  else if(counts.OFFLINE) title=`${counts.AMAN} alat AMAN, ${counts.OFFLINE} OFFLINE`;
  else title=`Semua alat (${n}) AMAN`;
  $('sumTitle').textContent=title;
  $('sumTitle').style.color=counts.BERBAHAYA?statusColor('BERBAHAYA'):counts.WASPADA?statusColor('WASPADA'):'';
  $('sumPills').innerHTML=['BERBAHAYA','WASPADA','AMAN','OFFLINE'].map(k=>`
    <span class="sum-pill${counts[k]?'':' zero'}"><i style="background:${statusColor(k)}"></i>${k}<b>${counts[k]}</b></span>`).join('');
  document.title=(counts.BERBAHAYA?`(${counts.BERBAHAYA} BERBAHAYA) `:counts.WASPADA?`(${counts.WASPADA} WASPADA) `:'')+'EPEN — Ringkasan Lab';

  // Kartu, dikelompokkan per lokasi
  if(!n){
    $('groups').innerHTML='<div class="empty">Belum ada perangkat aktif. Daftarkan perangkat terlebih dahulu (atau jalankan <code>npm run db:seed</code>).</div>';
    return;
  }
  const byName=(a,b)=>a.d.device_name.localeCompare(b.d.device_name,'id',{numeric:true});
  const groups=new Map();
  items.forEach(it=>{if(!groups.has(it.d.location))groups.set(it.d.location,[]);groups.get(it.d.location).push(it);});
  const showHeading=groups.size>1;
  $('groups').innerHTML=[...groups.entries()]
    .sort((a,b)=>a[0].localeCompare(b[0],'id',{numeric:true}))
    .map(([loc,list])=>{
      list.sort((a,b)=>SEVERITY[b.st.status]-SEVERITY[a.st.status]||byName(a,b));
      return `<section>
        ${showHeading?`<h2 class="group-title">${esc(loc)}<small>${list.length} alat</small></h2>`:''}
        <div class="grid">${list.map(it=>cardHtml(it.d,it.st)).join('')}</div>
      </section>`;
    }).join('<div style="height:28px"></div>');
}

/* FETCH */
let inFlight=false;
async function loadOverview(){
  if(inFlight) return;
  inFlight=true;
  try{
    const res=await fetch('/api/overview');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json=await res.json();
    render(json);
    showError('');
    $('updated').textContent=fmtTime(json.server_time);
  }catch(e){
    console.error('[overview]',e);
    showError('Server tidak dapat dihubungi. Data di bawah mungkin sudah tidak terbaru. Mencoba lagi...');
  }finally{
    inFlight=false;
  }
}

(async function init(){
  EpenAuth.renderWidget($('authWidget'));
  await loadConfig();
  await loadOverview();
  setInterval(loadOverview,CFG.poll_interval_ms);
})();
</script>
</body>
</html>
