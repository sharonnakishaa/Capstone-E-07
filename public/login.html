<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8" />
<title>EPEN — Masuk</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F172A;--surface:#1E293B;--surface-2:#172033;--border:#334155;--border-soft:#243044;
    --text:#F1F5F9;--text-strong:#FFFFFF;--muted:#94A3B8;--muted-2:#64748B;
    --series:#38BDF8;
    --sans:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
    --err-bg:#3B0A0A;--err-border:#7F1D1D;--err-text:#FECACA;
  }
  [data-theme="light"]{
    --bg:#F0F4F8;--surface:#FFFFFF;--surface-2:#F8FAFC;--border:#E2E8F0;--border-soft:#E2E8F0;
    --text:#1E293B;--text-strong:#0F172A;--muted:#475569;--muted-2:#64748B;
    --series:#0284C7;
    --err-bg:#FEE2E2;--err-border:#FECACA;--err-text:#991B1B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;font-size:14px;line-height:1.45;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 24px}
  .brand-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em}
  h1{font-size:22px;font-weight:700;color:var(--text-strong);letter-spacing:-.01em;margin:6px 0 4px}
  .sub{font-size:13px;color:var(--muted-2);margin:0 0 22px}
  form{display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:5px}
  label{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  input{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:var(--sans);font-size:14px;color:var(--text);outline:none;width:100%}
  input:focus{border-color:var(--series)}
  button{height:40px;border-radius:8px;border:1px solid var(--series);background:var(--series);color:var(--surface);font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:progress}
  .msg{display:none;font-size:13px;padding:9px 12px;border-radius:8px;background:var(--err-bg);border:1px solid var(--err-border);color:var(--err-text)}
  .msg.show{display:block}
  .foot{margin-top:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted-2)}
  .foot a{color:var(--series);font-weight:600;text-decoration:none}
  .foot a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <div class="brand-title">EPEN DASHBOARD</div>
    <h1>Masuk Pengelola Lab</h1>
    <p class="sub">Dibutuhkan untuk mencatat penggantian filter dan mengekspor CSV. Halaman pemantauan tetap bisa dibuka tanpa masuk.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="msg" id="msg" role="alert"></div>
      <button type="submit" id="submitBtn">Masuk</button>
    </form>

    <div class="foot">
      <a href="/lab.html">‹ Kembali ke Ringkasan Lab</a>
      <span>Belum punya akun? Hubungi tim Epen.</span>
    </div>
  </main>

<script>
(function(){
  try{ if(localStorage.getItem('epen-theme')==='dark') document.documentElement.dataset.theme='dark'; }catch(e){}
})();

/** Hanya izinkan tujuan di situs ini (cegah open redirect ke situs lain). */
function nextUrl(){
  const n=new URLSearchParams(location.search).get('next')||'';
  return n.startsWith('/')&&!n.startsWith('//')&&!n.startsWith('/\\')?n:'/lab.html';
}

const $=id=>document.getElementById(id);
function showMsg(t){$('msg').textContent=t;$('msg').classList.toggle('show',!!t);}

// Kalau sudah masuk, langsung lanjut
fetch('/api/auth/me',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.user)location.replace(nextUrl());}).catch(()=>{});

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('email').value.trim(), password=$('password').value;
  if(!email||!password) return showMsg('Isi email dan password.');
  const btn=$('submitBtn');
  btn.disabled=true; btn.textContent='Memeriksa...'; showMsg('');
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const json=await res.json().catch(()=>null);
    if(!res.ok) throw new Error(json?.error??`Gagal masuk (HTTP ${res.status}).`);
    location.replace(nextUrl());
  }catch(err){
    showMsg(err.message);
    $('password').value='';
    $('password').focus();
    btn.disabled=false; btn.textContent='Masuk';
  }
});
</script>
</body>
</html>
