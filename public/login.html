<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8" />
<title>EPEN — Masuk</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&family=Playfair+Display+SC:wght@700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/epen.css">
<style>
  body{display:flex;align-items:center;justify-content:center;padding:32px 16px;
    background-image:radial-gradient(var(--border-soft) 1.2px,transparent 1.2px);background-size:22px 22px}
  .login{width:100%;max-width:440px;display:flex;flex-direction:column;gap:22px}
  .login .brand{align-self:flex-start}
  .login-card{padding:30px 28px;box-shadow:var(--sh-lg);display:flex;flex-direction:column}
  h1{font-family:var(--display);font-size:34px;font-weight:900;line-height:1.05;color:var(--text-strong);letter-spacing:.01em;margin:18px 0 10px}
  h1 em{font-style:normal;color:var(--accent);display:block}
  .sub{font-size:14px;color:var(--muted);margin:0 0 24px;line-height:1.55}
  form{display:flex;flex-direction:column;gap:16px}
  .field input{font-family:var(--sans);font-size:15px;padding:11px 12px;width:100%}
  .btn-primary{height:46px;width:100%;font-size:15px;margin-top:4px}
  .btn-primary:disabled{cursor:progress}
  .msg{display:none;font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--err-bg);border:2px solid var(--err-border);color:var(--err-text);font-weight:600}
  .msg.show{display:block}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .foot a{color:var(--accent);font-weight:800;text-decoration:none}
  .foot a:hover{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
  <main class="login">
    <a class="brand" href="/lab.html" aria-label="EPEN — kembali ke Ringkasan Lab">
      <span class="brand-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(45 12 12)"><rect x="9.5" y="0.5" width="5" height="9" rx="2"/><path d="M12 9.5v5.5"/><path d="M10.6 15h2.8L12 20.5z"/></g><path d="M2.5 21.5h6"/><path d="M3.5 12.5c-1.2-1.4 1.2-2.6 0-4M7 9c-1.2-1.4 1.2-2.6 0-4"/></svg></span>
      <span class="brand-text"><span class="brand-title">EPEN</span><span class="brand-sub">Pemantau Asap Solder</span></span>
    </a>

    <section class="card login-card">
      <span class="tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Akses terbatas</span>
      <h1>Masuk <em>Pengelola Lab</em></h1>
      <p class="sub">Dibutuhkan untuk mencatat penggantian filter dan mengekspor data ke Excel. Halaman pemantauan tetap bisa dibuka tanpa masuk.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <div class="msg" id="msg" role="alert"></div>
        <button type="submit" class="btn-primary" id="submitBtn">Masuk</button>
      </form>
    </section>

    <div class="foot">
      <a href="/lab.html">‹ Kembali ke Ringkasan Lab</a>
      <span>Belum punya akun? Hubungi tim Epen.</span>
    </div>
  </main>

<script>
(function(){
  try{ if(localStorage.getItem('epen-theme')==='dark') document.documentElement.dataset.theme='dark'; }catch(e){}
})();

/** Hanya izinkan tujuan di situs ini (cegah open redirect ke situs lain). */
function nextUrl(){
  const n=new URLSearchParams(location.search).get('next')||'';
  return n.startsWith('/')&&!n.startsWith('//')&&!n.startsWith('/\\')?n:'/lab.html';
}

const $=id=>document.getElementById(id);
function showMsg(t){$('msg').textContent=t;$('msg').classList.toggle('show',!!t);}

// Kalau sudah masuk, langsung lanjut
fetch('/api/auth/me',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.user)location.replace(nextUrl());}).catch(()=>{});

/** Terlalu banyak percobaan gagal (429): kunci tombol dengan hitung mundur sampai boleh mencoba lagi. */
let lockTimer;
function lockForm(sec){
  const btn=$('submitBtn'), until=Date.now()+sec*1000;
  clearInterval(lockTimer);
  const tick=()=>{
    const left=Math.ceil((until-Date.now())/1000);
    if(left<=0){clearInterval(lockTimer);btn.disabled=false;btn.textContent='Masuk';showMsg('');return;}
    btn.disabled=true;
    btn.textContent=`Coba lagi dalam ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  };
  tick(); lockTimer=setInterval(tick,1000);
}

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('email').value.trim(), password=$('password').value;
  if(!email||!password) return showMsg('Isi email dan password.');
  const btn=$('submitBtn');
  btn.disabled=true; btn.textContent='Memeriksa...'; showMsg('');
  let retryAfter=0;
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const json=await res.json().catch(()=>null);
    if(res.status===429) retryAfter=Number(json?.retry_after_sec)||Number(res.headers.get('Retry-After'))||60;
    if(!res.ok) throw new Error(json?.error??`Gagal masuk (HTTP ${res.status}).`);
    location.replace(nextUrl());
  }catch(err){
    showMsg(err.message);
    $('password').value='';
    $('password').focus();
    if(retryAfter) lockForm(retryAfter);
    else { btn.disabled=false; btn.textContent='Masuk'; }
  }
});
</script>
</body>
</html>
